name: Test missing OIDC permissions
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Intentionally NOT setting id-token: write so OIDC env vars are absent
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          scope: some-org/some-repo
          identity: test-identity

      - name: Assert action failed due to missing OIDC permissions
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when OIDC permissions are missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when OIDC permissions are missing"
