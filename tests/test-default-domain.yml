name: Test default domain input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action uses the default domain (octo-sts.dev) when not specified.
      # The action will fail due to missing OIDC env vars under act, but the failure
      # should be the OIDC error, not an input validation error.
      - id: action-default-domain
        uses: .
        continue-on-error: true
        with:
          scope: octo-org/octo-repo
          identity: my-identity
          # domain is intentionally omitted to test the default value of octo-sts.dev

      - name: Assert action failed (expected — no OIDC under act)
        env:
          OUTCOME: ${{ steps.action-default-domain.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when OIDC env vars are missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed (OIDC not available under act, default domain accepted)"

      # Test with explicit domain to ensure the domain input is accepted
      - id: action-explicit-domain
        uses: .
        continue-on-error: true
        with:
          scope: octo-org/octo-repo
          identity: my-identity
          domain: octo-sts.dev

      - name: Assert action with explicit domain also failed (expected — no OIDC under act)
        env:
          OUTCOME: ${{ steps.action-explicit-domain.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when OIDC env vars are missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with explicit domain (OIDC not available under act)"
