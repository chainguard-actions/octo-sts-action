name: Test token output is defined
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke octo-sts action (expect failure - no valid OIDC token in act)
        id: octo-sts
        uses: .
        with:
          scope: octo-sts/action
          identity: test-identity
        continue-on-error: true

      - name: Assert action outcome is not skipped
        env:
          OUTCOME: ${{ steps.octo-sts.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME)"

      - name: Verify token output key exists (may be empty on failure)
        env:
          TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          echo "token output present (value may be empty due to no OIDC token in act environment)"
          # In a real GitHub Actions environment with OIDC enabled, this would be a non-empty token.
          # In act, the action fails before producing a token, so we just verify the step ran.
          echo "PASS: token output key is accessible"
