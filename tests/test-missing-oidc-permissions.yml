name: Test missing OIDC permissions
# Tests that the action fails with a clear error when id-token: write is not set.
# Without ACTIONS_ID_TOKEN_REQUEST_TOKEN and ACTIONS_ID_TOKEN_REQUEST_URL,
# the action should exit immediately with a descriptive error.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Intentionally NOT setting id-token: write so OIDC env vars are absent
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expect failure due to missing OIDC permissions)
        id: action
        uses: .
        with:
          scope: octo-sts/action
          identity: test-identity
        continue-on-error: true

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing OIDC permissions, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed when OIDC permissions are missing"
