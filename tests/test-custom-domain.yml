name: Test custom domain input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: octo-sts
        uses: .
        continue-on-error: true
        with:
          domain: octo-sts.dev
          scope: octo-org/octo-repo
          identity: my-identity
      - name: Assert action ran with custom domain (inputs were accepted)
        env:
          OUTCOME: ${{ steps.octo-sts.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail in act because there is no real
          # OIDC token or Octo STS service reachable, but the inputs must
          # be accepted without a configuration error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with domain, scope, and identity inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
