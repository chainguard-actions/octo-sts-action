name: Test custom domain input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          domain: invalid.example.invalid
          scope: example-org/example-repo
          identity: example-policy

      - name: Assert action failed when using unreachable custom domain
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the custom domain is unreachable.
          # This verifies the domain input is accepted and used in the STS request.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable domain, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when custom domain was unreachable"
