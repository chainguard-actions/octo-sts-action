name: Test with custom domain input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: octo-sts
        uses: .
        continue-on-error: true
        with:
          domain: octo-sts.dev
          scope: example-org/example-repo
          identity: ci

      - name: Assert action was invoked with all inputs including domain
        env:
          OUTCOME: ${{ steps.octo-sts.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail without a real OIDC token/network access,
          # but it must have been invoked (outcome is either 'success' or 'failure', not 'skipped').
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with domain, scope, and identity inputs"
