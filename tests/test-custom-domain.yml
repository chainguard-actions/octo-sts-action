name: Test with custom domain input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: octo-sts
        uses: .
        with:
          domain: octo-sts.dev
          scope: example-org/example-repo
          identity: ci
        continue-on-error: true
      - name: Assert action was invoked with all inputs
        env:
          OUTCOME: ${{ steps.octo-sts.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail in act because no real OIDC token is available.
          # We verify the action was invoked with domain, scope, and identity inputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with domain, scope, and identity inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
