name: Test custom domain with scope and identity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: octo-sts
        uses: .
        continue-on-error: true
        with:
          scope: example-org/example-repo
          identity: ci-identity
          domain: custom.octo-sts.example.com

      - name: Assert action ran with custom domain and required inputs
        env:
          OUTCOME: ${{ steps.octo-sts.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail in a test environment because
          # there is no real Octo STS service or valid OIDC token available.
          # We verify it ran (not skipped) — confirming scope, identity, and
          # custom domain inputs were accepted without input validation errors.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it should have attempted to run"
            exit 1
          fi
          echo "PASS: action attempted to run with custom domain, scope, and identity inputs"
