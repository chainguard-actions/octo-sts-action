name: Test token output is absent on failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: octo-sts
        uses: .
        continue-on-error: true
        with:
          scope: example-org/example-repo
          identity: example-identity

      - name: Assert token output is empty when action fails
        env:
          OUTCOME: ${{ steps.octo-sts.outcome }}
          TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          echo "outcome: $OUTCOME"
          echo "token value: '$TOKEN'"
          if [ "$OUTCOME" = "success" ] && [ -z "$TOKEN" ]; then
            echo "FAIL: action succeeded but token output is empty"
            exit 1
          fi
          if [ "$OUTCOME" = "failure" ] && [ -n "$TOKEN" ]; then
            echo "FAIL: action failed but token output is unexpectedly set"
            exit 1
          fi
          echo "PASS: token output state is consistent with action outcome"
