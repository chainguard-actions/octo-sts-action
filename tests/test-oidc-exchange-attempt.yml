name: Test STS exchange attempt with OIDC
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          scope: octo-sts/action
          identity: self

      - name: Assert action attempted STS exchange (failed at STS, not at OIDC check)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the STS service will reject the token
          # (this repo is not authorized), but it should NOT fail due to missing
          # OIDC env vars. Either outcome (success or failure) is acceptable here
          # as long as the action ran past the OIDC check.
          # In practice, the STS service will reject the request, so outcome=failure.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
