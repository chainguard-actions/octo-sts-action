name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: octo-sts
        uses: .
        with:
          scope: octo-org/octo-repo
          identity: my-identity
        continue-on-error: true
      - name: Assert action ran (expected to fail without real OIDC token)
        env:
          OUTCOME: ${{ steps.octo-sts.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail in act because no real OIDC token is available.
          # We only verify that the action was invoked with the required inputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with scope and identity inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
