name: Test basic usage - octo-sts action invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke octo-sts action (expect failure - no valid OIDC token in act)
        id: action
        uses: .
        with:
          scope: octo-sts/action
          identity: test-identity
        continue-on-error: true

      - name: Assert action was invoked and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no valid OIDC token in act,
          # but it should NOT fail due to missing required inputs.
          # Any outcome other than 'skipped' means the action was invoked.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME)"
