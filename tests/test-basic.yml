name: Test basic usage - Octo STS
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Octo STS action (expected to fail without real OIDC token)
        id: octo-sts
        uses: .
        with:
          scope: octo-org/octo-repo
          identity: my-identity
        continue-on-error: true

      - name: Assert action attempted to run and failed gracefully
        env:
          OUTCOME: ${{ steps.octo-sts.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In act/local environment, the action will fail because there is no
          # real OIDC token available. We expect 'failure', not 'skipped'.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real OIDC token was available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without a real OIDC token"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
