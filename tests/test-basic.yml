name: Test basic usage with scope and identity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: octo-sts
        uses: .
        continue-on-error: true
        with:
          scope: octo-org/octo-repo
          identity: my-identity
          domain: octo-sts.dev

      - name: Assert action ran with required inputs
        env:
          OUTCOME: ${{ steps.octo-sts.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail in a test environment because
          # there is no real Octo STS service or valid OIDC token available.
          # We verify it ran (not skipped) and failed gracefully rather than
          # erroring due to missing inputs.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it should have attempted to run"
            exit 1
          fi
          echo "PASS: action attempted to run with scope and identity inputs"
