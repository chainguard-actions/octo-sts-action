name: Test basic usage with scope and identity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Attempt token exchange (expected to fail without real OIDC token)
        id: octo-sts
        uses: .
        continue-on-error: true
        with:
          scope: octo-org/octo-repo
          identity: my-identity
          domain: octo-sts.dev

      - name: Assert action was invoked (outcome is failure due to no OIDC token in act)
        env:
          OUTCOME: ${{ steps.octo-sts.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no real OIDC token in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
