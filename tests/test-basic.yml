name: Test basic usage - missing OIDC token fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: octo-sts
        uses: .
        continue-on-error: true
        with:
          scope: octo-sts/action
          identity: test-identity

      - name: Assert action failed (no valid OIDC token in act)
        env:
          OUTCOME: ${{ steps.octo-sts.outcome }}
          TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          echo "outcome: $OUTCOME"
          echo "token present: $([ -n "$TOKEN" ] && echo yes || echo no)"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail without a valid OIDC token"
            exit 1
          fi
          echo "PASS: action failed as expected without valid OIDC token"
