name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: octo-sts
        uses: .
        with:
          scope: octo-org/octo-repo
          identity: test-identity
        continue-on-error: true

      - name: Assert action ran with required inputs
        run: |
          echo "Action completed (with or without error, since no real OIDC token is available in act)"
          echo "outcome: ${{ steps.octo-sts.outcome }}"
          # The action should either succeed or fail gracefully
          # In act environment without real OIDC token, failure is expected
          if [ "${{ steps.octo-sts.outcome }}" = "success" ] || [ "${{ steps.octo-sts.outcome }}" = "failure" ]; then
            echo "PASS: action ran with scope and identity inputs"
          else
            echo "FAIL: unexpected outcome: ${{ steps.octo-sts.outcome }}"
            exit 1
          fi
