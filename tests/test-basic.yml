name: Test basic usage - octo-sts action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke octo-sts action (expected to fail without real OIDC token)
        id: action
        uses: .
        continue-on-error: true
        with:
          scope: octo-org/octo-repo
          identity: my-identity

      - name: Assert action was attempted (outcome is failure due to missing OIDC token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In act/local environment, there is no real OIDC token or STS service,
          # so the action is expected to fail. We verify it ran and produced a
          # failure outcome rather than being skipped or erroring at the workflow level.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run and fail"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
