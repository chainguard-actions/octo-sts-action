name: Test invalid scope and identity
# Tests that the action fails gracefully when given a non-existent scope/identity.
# With id-token: write set, the action will obtain an OIDC token but the STS
# exchange will fail because the scope/identity don't exist.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid scope (expect failure)
        id: action
        uses: .
        with:
          scope: this-org-does-not-exist-xyz123/this-repo-does-not-exist-xyz123
          identity: nonexistent-identity
        continue-on-error: true

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid scope/identity, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid scope/identity"
