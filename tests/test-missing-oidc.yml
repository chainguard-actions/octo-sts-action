name: Test missing OIDC environment variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires ACTIONS_ID_TOKEN_REQUEST_TOKEN and ACTIONS_ID_TOKEN_REQUEST_URL
      # to be set (i.e. id-token: write permission). Under act these are not available,
      # so the action should exit with code 1 and print a specific error message.
      - id: action
        uses: .
        continue-on-error: true
        with:
          scope: octo-org/octo-repo
          identity: my-identity

      - name: Assert action failed due to missing OIDC env vars
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when OIDC env vars are missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when OIDC env vars are not available"
